name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 先构建：Nuxt UI 会在构建时生成 auto-imports.d.ts / components.d.ts，
      # 类型检查依赖这两个文件，顺序不能反。
      - name: 构建
        run: pnpm run build:app

      - name: 类型检查
        run: pnpm run typecheck

      - name: 格式与 lint
        run: pnpm exec vp check
