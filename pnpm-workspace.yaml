allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
# 让 Vite+ 独占 Node.js / pnpm 版本管理，避免和 pnpm 自带的 runtime 管理打架
# https://viteplus.dev/guide/env
runtimeOnFail: ignore
pmOnFail: ignore
